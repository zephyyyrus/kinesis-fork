name: Build Custom Kernel SM6250

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Setup Build Environment
      run: |
        echo ">> Menginstall Dependencies..."
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip

    - name: Download Toolchain (Proton Clang)
      run: |
        echo ">> Mengambil Proton Clang 13..."
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Patch KernelSU Next v3.3.0 & SUSFS
      run: |
        echo ">> Memasang KernelSU Next & SUSFS..."
        rm -rf KernelSU drivers/kernelsu
        git clone https://github.com/rifsxd/KernelSU-Next.git -b v3.3.0 drivers/kernelsu
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.14
        
        cp susfs4ksu/kernel_patches/fs/susfs.c fs/
        cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
        cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
        
        cd drivers/kernelsu
        patch -p1 < ../../susfs4ksu/ksu_patches/ksu_next_v3.3.0_susfs.patch || true
        cd ../..
        patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true

    - name: Build Kernel
      run: |
        echo ">> Menambahkan Config KSU, SUSFS, Universal OS & Uclamp..."
        cat <<EOF >> arch/arm64/configs/vendor/joyeuse_defconfig
        # KSU & SUSFS
        CONFIG_KSU=y
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        
        # Universal MIUI 12 - HyperOS 3 & Android 11 - 16
        CONFIG_MIUI_CUSTOM_DISPLAY=y
        CONFIG_ANDROID_BINDER_IPC=y
        CONFIG_ANDROID_BINDERFS=y
        CONFIG_ASHMEM=y
        CONFIG_BPF_SYSCALL=y
        CONFIG_CGROUP_BPF=y
        CONFIG_EROFS_FS=y
        CONFIG_F2FS_FS=y
        
        # Optimisasi Uclamp
        CONFIG_UCLAMP_TASK=y
        CONFIG_UCLAMP_BUCKETS_COUNT=20
        EOF
        
        echo ">> Memulai Kompilasi Kernel..."
        export PATH=$(pwd)/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        make O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- vendor/joyeuse_defconfig
        make -j$(nproc --all) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package AnyKernel3
      run: |
        echo ">> Membungkus ke AnyKernel3..."
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
        cp out/arch/arm64/boot/Image.gz-dtb ak3/ || echo "Image.gz-dtb tidak ditemukan"
        cd ak3
        rm -rf .git README.md
        zip -r9 ../CustomKernel-SM6250-KSU-SUSFS.zip *

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CustomKernel-SM6250-KSU-SUSFS
        path: CustomKernel-SM6250-KSU-SUSFS.zip
